      <div class="tile"><b>${s.sessions}</b><span>sessions active</span></div>
      <div class="tile"><b style="color:#fde68a">${money(s.cost)}</b><span>spent (session totals)</span></div>
      <div class="tile"><b>${s.events}</b><span>steps taken</span></div>
      <div class="tile"><b style="color:#4ade80">+${kfmt(s.linesAdded)}</b><span>lines added</span></div>
      <div class="tile"><b>${s.filesChanged}</b><span>files changed</span></div>
    </div>
    <div class="k" style="color:var(--dim);font-size:11px;letter-spacing:.16em;margin:20px 0 4px;font-weight:700">WHAT THE AGENTS DID</div>
    <div class="stack">${Object.entries(s.tools).sort((a, b) => b[1] - a[1]).map(([t, n]) => `<div title="${TOOLS[toolOf(t)].label}: ${n}" style="flex-grow:0;background:${TOOLS[toolOf(t)].c}" data-g="${n / toolTotal}"></div>`).join('')}</div>
    <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;font-size:12px;color:var(--muted)">${Object.entries(s.tools).sort((a, b) => b[1] - a[1]).map(([t, n]) => `<span><b style="color:${TOOLS[toolOf(t)].c}">■</b> ${t === 'user' ? 'Your messages' : TOOLS[toolOf(t)].label} ${Math.round(n / toolTotal * 100)}%</span>`).join('')}</div>
    <div class="k" style="color:var(--dim);font-size:11px;letter-spacing:.16em;margin:20px 0 4px;font-weight:700">TIME BY PROJECT</div>
    <div class="bars">${projs.map(([p, v]) => `<div class="bar"><span style="color:${hue(p)};font-weight:600">${esc(p)}</span><div class="track"><div class="fill" style="background:${hue(p)}" data-w="${v.minutes / maxMin * 100}"></div></div><em>${v.minutes}m · ${money(v.cost)}</em></div>`).join('')}</div>
    ${s.topFiles.length ? `<div class="k" style="color:var(--dim);font-size:11px;letter-spacing:.16em;margin:20px 0 4px;font-weight:700">MOST EDITED FILES</div>
    <div class="bars">${s.topFiles.map(f => `<div class="bar"><span class="mono" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(f.path)}">${esc(f.name)}</span><div class="track"><div class="fill" style="background:${TOOLS.edit.c}" data-w="${f.n / s.topFiles[0].n * 100}"></div></div><em>${f.n} edits</em></div>`).join('')}</div>` : ''}`
  modal.classList.add('on')
  requestAnimationFrame(() => requestAnimationFrame(() => {
    sheet.querySelectorAll('[data-w]').forEach(el => { el.style.width = el.dataset.w + '%' })
    sheet.querySelectorAll('[data-g]').forEach(el => { el.style.flexGrow = el.dataset.g })
  }))
}

// ===================== mini overlay (always-on-top window) =====================
const mini = { win: null, ctx: null, list: null }
document.getElementById('bMini').onclick = async () => {
  if (mini.win) { mini.win.close(); return }
  let win
  if ('documentPictureInPicture' in window) {
    win = await documentPictureInPicture.requestWindow({ width: 420, height: 720 })
  } else {
    win = window.open('', 'radar-mini', 'width=420,height=720')
    if (!win) return
  }
  win.document.body.innerHTML = `
    <style>
      body { margin: 0; background: #05080f; color: #e2e8f0; font: 13px/1.4 ui-sans-serif, Segoe UI, sans-serif; overflow: auto; }
      .nn { padding: 8px 10px 0; display: grid; gap: 8px; }
      .nn:empty { display: none; }
      .c { background: #0a0f1c; border: 1px solid #065f46; border-radius: 12px; padding: 10px 12px; box-shadow: 0 0 18px #10b98122; animation: in .4s ease both; }
      @keyframes in { from { opacity: 0; transform: translateY(-6px) } }
      .c .t { font-weight: 700; display: flex; gap: 6px; align-items: center; }
      .c .t i { width: 8px; height: 8px; border-radius: 50%; background: #34d399; box-shadow: 0 0 8px #34d399; animation: b 1.6s infinite; flex: none; }
      .c .p { color: #64748b; font-size: 11.5px; margin-left: 14px; }
      .c .m { max-height: 200px; overflow: auto; margin: 8px 0; font-size: 12.5px; line-height: 1.45; color: #cbd5e1; word-break: break-word; }
      .c .m .sp { height: 6px; } .c .m .h { font-weight: 700; color: #e2e8f0; } .c .m .li { padding-left: 12px; text-indent: -9px; }
      .c .m code, .c .m pre { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; color: #a5f3fc; background: #111a2e; border-radius: 4px; padding: 0 3px; }
      .c .m pre { padding: 6px 8px; overflow: auto; white-space: pre; }
      .c .m b { color: #e2e8f0; }
      .c textarea { width: 100%; box-sizing: border-box; min-height: 48px; resize: vertical; background: #0b1222; color: #e2e8f0; border: 1px solid #1c2740; border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 12.5px; }
      .c .a { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
      .c button { font: inherit; font-size: 12px; cursor: pointer; border-radius: 999px; padding: 4px 12px; border: 1px solid #1c2740; background: #0d1322; color: #94a3b8; }
      .c button.s { background: linear-gradient(90deg, #0891b2, #7c3aed); border: 0; color: white; font-weight: 600; }
      .c .st { font-size: 11.5px; margin-top: 4px; }
      canvas { width: 100%; height: 190px; display: block; border-bottom: 1px solid #1c2740; }
      .l { padding: 8px 10px; display: grid; gap: 6px; }
      .r { display: grid; grid-template-columns: 10px 1fr; gap: 0 8px; align-items: center; }
      .r i { width: 8px; height: 8px; border-radius: 50%; background: var(--s); box-shadow: 0 0 8px var(--s); }
      .r.working i { animation: b 1s infinite; } .r.sleeping { opacity: .5; } .r.sleeping i { box-shadow: none }
      .r b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
      .r span { grid-column: 2; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: ui-monospace, Consolas, monospace; font-size: 11px; }
      .r.working span { color: var(--t); }
      @keyframes b { 50% { opacity: .35 } }
    </style>
    <canvas id="m"></canvas><div class="nn" id="nn"></div><div class="l" id="l"></div>`
  win.document.title = 'Agent Radar'
  const c = win.document.getElementById('m')
  mini.win = win; mini.ctx = c.getContext('2d'); mini.canvas = c; mini.list = win.document.getElementById('l')
  mini.notes = win.document.getElementById('nn'); mini.cards = new Map()
  updateMiniList([...agents.values()].map(a => a.row))
  syncMiniNotes()
  document.getElementById('bMini').classList.add('on')
  win.addEventListener('pagehide', () => { mini.win = mini.ctx = mini.list = mini.notes = null; document.getElementById('bMini').classList.remove('on') })
}
function drawMini() {
  const c = mini.canvas
  const w = c.clientWidth, h = c.clientHeight
  if (c.width !== w * 2) { c.width = w * 2; c.height = h * 2 }
  const k = Math.min(c.width / canvas.width, c.height / canvas.height)
  mini.ctx.fillStyle = '#05080f'; mini.ctx.fillRect(0, 0, c.width, c.height)
  mini.ctx.drawImage(canvas, (c.width - canvas.width * k) / 2, (c.height - canvas.height * k) / 2, canvas.width * k, canvas.height * k)
}
// The same notification cards in the mini window, each with its own reply box.
function syncMiniNotes() {
  if (!mini.notes) return
  const doc = mini.win.document
  for (const [id, card] of mini.cards) if (!notes.has(id)) { card.el.remove(); mini.cards.delete(id) }
  for (const [id, n] of notes) {
    let card = mini.cards.get(id)
    if (!card) {
      const el = doc.createElement('div')
      el.className = 'c'
      el.innerHTML = `<div class="t"><i></i><span></span></div><div class="p"></div><div class="m"></div>
        <textarea placeholder="Reply… (Ctrl+Enter to send)"></textarea>
        <div class="a"><button class="s">Send</button><button class="o" hidden>↗ Open in Claude</button><button class="d">Dismiss</button></div><div class="st"></div>`
      card = { el, messageAt: null }
      mini.cards.set(id, card)
      mini.notes.prepend(el)
      const ta = el.querySelector('textarea')
      const send = async () => {
        if (await sendReply(id, ta.value, el.querySelector('.st'))) { ta.value = ''; setTimeout(() => markRead(id), 1600) }
      }
      el.querySelector('.s').onclick = send
      ta.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) send() })
      el.querySelector('.d').onclick = () => markRead(id)
      el.querySelector('.o').onclick = () => { const l = notes.get(id)?.row.appLink; if (l) window.location.href = l }
    }
    card.el.querySelector('.o').hidden = !n.row.appLink
    if (card.messageAt !== n.messageAt) {
      card.messageAt = n.messageAt
      card.el.querySelector('.t span').textContent = n.row.title
      card.el.querySelector('.p').textContent = `${n.row.project} · ✓ done`
      card.el.querySelector('.m').innerHTML = md(n.row.message || n.row.doing || '')
      const why = cantReply(n.row)
      card.el.querySelector('textarea').hidden = !!why
      card.el.querySelector('.s').hidden = !!why
      card.el.querySelector('.st').textContent = why
    }
  }
}
function updateMiniList(rows) {
  if (!mini.list) return
  mini.list.innerHTML = rows.slice(0, 8).map(r => `<div class="r ${r.status}" style="--s:${STATUS[r.status].c};--t:${TOOLS[toolOf(r.tool)].c}"><i></i><b>${esc(r.title)}</b><span>${esc(r.status === 'sleeping' ? 'asleep · ' + r.project : (r.status === 'working' ? TOOLS[toolOf(r.tool)].label + ' · ' : '') + r.doing)}</span></div>`).join('')
}

// ===================== timeline & replay =====================
const tl = document.getElementById('tl'), tctx = tl.getContext('2d')
const replay = { on: false, playing: false, t: 0, speed: store.get('radar.speed', 120), data: null }
let lastRows = []
let relayId = null
// why a session can't take a reply right now, or '' when it can
const cantReply = r => r.id === relayId
  ? 'This is the session that delivers replies, and it can’t message itself. Reply to it in the Claude app.'
  : !r.isLive ? 'This session isn’t open, so it can’t get a reply. Open it in the Claude app, or copy its resume command from Details.' : ''
// when the safety check blocks a send, point to the button that always works
const blockedHint = ' Use “Open in Claude” to reply there instead.'
const tlWhen = document.getElementById('tlWhen'), bPlay = document.getElementById('bPlay'), bLive = document.getElementById('bLive'), bSpeed = document.getElementById('bSpeed')
bSpeed.textContent = replay.speed + '×'
bSpeed.onclick = () => { replay.speed = { 60: 120, 120: 300, 300: 600, 600: 60 }[replay.speed] ?? 120; store.set('radar.speed', replay.speed); bSpeed.textContent = replay.speed + '×' }

async function loadTimeline() {
  const d = await fetch('/timeline?h=6').then(r => r.json()).catch(() => null)
  if (d) { replay.data = d; drawTimeline() }
}
async function startReplay(t) {
  if (!replay.data || Date.now() - replay.data.to > 30e3) await loadTimeline()
  if (!replay.data) return
  if (!replay.on) { replay.on = true; feed.innerHTML = '' }
  replay.t = Math.max(replay.data.from, Math.min(replay.data.to, t ?? replay.data.from))
  paintReplay(); applyReplay(true)
}
function stopReplay() {
  replay.on = false; replay.playing = false
  for (const a of agents.values()) resetAgent(a)
  render(lastRows)
  paintReplay(); drawTimeline()
}
function paintReplay() {
  bPlay.textContent = replay.playing ? '⏸ Pause' : '▶ Replay'
  bLive.classList.toggle('on', !replay.on)
  const live = document.getElementById('live')
  live.classList.toggle('replay', replay.on)
  live.querySelector('span').textContent = replay.on ? 'REPLAY' : 'LIVE'
  tlWhen.textContent = replay.on ? timeStr(replay.t) : 'LIVE'
}
bPlay.onclick = async () => {
  if (!replay.on) { await startReplay(); replay.playing = true }
  else if (replay.t >= replay.data.to - 1000) { replay.t = replay.data.from; replay.playing = true }
  else replay.playing = !replay.playing
  paintReplay()
}
bLive.onclick = stopReplay

let replayTick = 0
function advanceReplay(dt) {
  replay.t += dt * 1000 * replay.speed
  if (replay.t >= replay.data.to) { replay.t = replay.data.to; replay.playing = false }
  replayTick += dt
  if (replayTick > 0.15) { replayTick = 0; applyReplay(); paintReplay(); drawTimeline() }
}
// Rebuild what every session looked like at replay.t from its event history.
function applyReplay(jump) {
  const T = replay.t
  const liveById = new Map(lastRows.map(r => [r.id, r]))
  const rows = []
  for (const s of replay.data.sessions) {
    let lo = 0, hi = s.events.length - 1, idx = -1
    while (lo <= hi) { const mid = (lo + hi) >> 1; if (s.events[mid][0] <= T) { idx = mid; lo = mid + 1 } else hi = mid - 1 }
    if (idx < 0) continue
    const [ts, cat, desc, end] = s.events[idx]
    const age = T - ts
    const status = age < 75e3 && !end ? 'working' : age > 15 * 60e3 ? 'sleeping' : end ? 'waiting' : 'idle'
    const live = liveById.get(s.id)
    rows.push({ id: s.id, title: s.title, project: s.project, status, doing: desc, tool: cat, task: live?.task ?? '',
      ago: age < 60e3 ? 'now' : age < 3600e3 ? Math.round(age / 60e3) + 'm ago' : Math.round(age / 3600e3) + 'h ago',
      cost: live?.cost ?? 0, files: [], subagents: [], cwd: live?.cwd ?? '', tokensOut: live?.tokensOut, linesAdded: live?.linesAdded, linesRemoved: live?.linesRemoved, lastAt: ts })
  }
  const rank = { working: 0, waiting: 1, idle: 2, sleeping: 3 }
  rows.sort((a, b) => rank[a.status] - rank[b.status] || b.lastAt - a.lastAt)
  render(rows, T)
}

function drawTimeline() {
  const r = tl.getBoundingClientRect()
  tl.width = r.width * DPR; tl.height = r.height * DPR
  tctx.setTransform(DPR, 0, 0, DPR, 0, 0)
  const w = r.width, h = r.height
  tctx.clearRect(0, 0, w, h)
  tctx.fillStyle = '#0a1122'; tctx.beginPath(); tctx.roundRect(0, 0, w, h, 8); tctx.fill()
  const d = replay.data
  if (!d) { tctx.fillStyle = '#64748b'; tctx.font = '12px Segoe UI'; tctx.fillText('Loading history…', 12, h / 2 + 4); return }
  const span = d.to - d.from, N = 144, bw = w / N
  const buckets = Array.from({ length: N }, () => ({}))
  for (const s of d.sessions) for (const [ts, cat] of s.events) {
    const b = Math.min(N - 1, Math.floor((ts - d.from) / span * N))
    if (b >= 0) buckets[b][toolOf(cat)] = (buckets[b][toolOf(cat)] ?? 0) + 1
  }
  const max = Math.max(4, ...buckets.map(b => Object.values(b).reduce((a, c) => a + c, 0)))
  const order = Object.keys(TOOLS)
  buckets.forEach((b, i) => {
    let y = h - 14
    for (const t of order) {
      if (!b[t]) continue
      const bh = b[t] / max * (h - 22)
      tctx.fillStyle = rgba(TOOLS[t].c, .85)
      tctx.fillRect(i * bw + .5, y - bh, Math.max(1, bw - 1), bh)
      y -= bh
    }
  })
  // hour ticks
  tctx.fillStyle = '#475569'; tctx.font = '10px ui-sans-serif, Segoe UI'
  for (let t = Math.ceil(d.from / 3600e3) * 3600e3; t < d.to; t += 3600e3) {
    const x = (t - d.from) / span * w
    tctx.fillRect(x, h - 12, 1, 4)
    tctx.fillText(new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), x + 3, h - 3)
  }
  // cursor
  const cx = replay.on ? (replay.t - d.from) / span * w : w - 1
  tctx.fillStyle = replay.on ? '#fbbf24' : '#22c55e'
  tctx.fillRect(cx - 1, 0, 2, h - 12)
  tctx.beginPath(); tctx.arc(cx, 4, 4, 0, 6.29); tctx.fill()
}
let dragging = false
const scrubTo = ev => {
  if (!replay.data) return
  const r = tl.getBoundingClientRect()
  const f = Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width))
  if (f > 0.995) { if (replay.on) stopReplay(); return }
  const t = replay.data.from + f * (replay.data.to - replay.data.from)
  if (!replay.on) startReplay(t)
  else { replay.t = t; applyReplay(true); paintReplay(); drawTimeline() }
}
tl.addEventListener('pointerdown', ev => { dragging = true; replay.playing = false; tl.setPointerCapture(ev.pointerId); scrubTo(ev) })
tl.addEventListener('pointermove', ev => { if (dragging) scrubTo(ev) })
tl.addEventListener('pointerup', () => { dragging = false; paintReplay() })

// ===================== polling =====================
const liveEl = document.getElementById('live')
async function poll() {
  try {
    const data = await fetch('/rows', { cache: 'no-store' }).then(r => r.json())
    const rows = data.rows
    relayId = data.relayId ?? null
    lastRows = rows
    if (!replay.on) render(rows)
    liveEl.classList.remove('off')
    if (!replay.on) liveEl.querySelector('span').textContent = 'LIVE'
  } catch {
    liveEl.classList.add('off'); liveEl.querySelector('span').textContent = 'OFFLINE'
  }
}
async function pollSummary() {
  const s = await fetch('/summary').then(r => r.json()).catch(() => null)
  if (s) document.getElementById('nCost').textContent = money(s.cost)
}

window.addEventListener('resize', () => { buildNetwork(); drawTimeline() })
const resize = step => {
  S = Math.round(Math.max(0.8, Math.min(2.2, S + step)) * 10) / 10
  store.set('radar.scale', S)
  applyScale()
  requestAnimationFrame(() => { buildNetwork(); drawTimeline() })
}
document.getElementById('bBigger').onclick = () => resize(0.1)
document.getElementById('bSmaller').onclick = () => resize(-0.1)
buildNetwork()
poll(); setInterval(poll, 2000)
pollSummary(); setInterval(pollSummary, 30e3)
loadTimeline(); setInterval(() => { if (!replay.on) loadTimeline() }, 60e3)
const tick = () => { document.getElementById('clock').textContent = timeStr(Date.now()) }
tick(); setInterval(tick, 1000)
requestAnimationFrame(frame)
</script>
