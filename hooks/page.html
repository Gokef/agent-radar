<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Radar</title>
<style>
  :root {
    --bg: #05080f; --panel: rgba(13, 19, 34, .8); --line: #1c2740;
    --text: #e2e8f0; --muted: #94a3b8; --dim: #64748b;
    --s: 1.3;
    --work: #22d3ee; --wait: #34d399; --idle: #94a3b8; --sleep: #818cf8; --sub: #c084fc;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: radial-gradient(ellipse at 40% 30%, #0b1530 0%, var(--bg) 70%); color: var(--text); overflow: hidden;
    font: 14px/1.4 ui-sans-serif, "Segoe UI", system-ui, sans-serif; }
  .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }
  button { font: inherit; color: inherit; cursor: pointer; }

  .app { height: 100%; display: grid; grid-template-columns: 1fr calc(360px * var(--s)); }
  .stage { position: relative; min-width: 0; overflow: hidden; }
  #net { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  header { zoom: var(--s); position: absolute; left: 24px; top: 18px; right: 24px; display: flex; align-items: flex-start; gap: 18px; pointer-events: none; z-index: 2; }
  header .btns, header .stats { pointer-events: auto; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: .3em;
    background: linear-gradient(90deg, #e2e8f0, #67e8f9, #c4b5fd, #e2e8f0); background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent; animation: sheen 8s linear infinite; }
  @keyframes sheen { to { background-position: 300% 0; } }
  .stats { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .stat { padding: 3px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); font-size: 12.5px; backdrop-filter: blur(8px); }
  .stat b { font-size: 14px; margin-right: 4px; }
  .right { margin-left: auto; text-align: right; }
  .clock { font-size: 24px; font-weight: 300; letter-spacing: .06em; font-variant-numeric: tabular-nums; }
  .live { display: inline-flex; align-items: center; gap: 8px; color: #4ade80; font-size: 11px; letter-spacing: .2em; }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 10px #22c55e; animation: breathe 2s ease-in-out infinite; }
  .live.off { color: #f87171; } .live.off i { background: #ef4444; box-shadow: 0 0 10px #ef4444; }
  .live.replay { color: #fbbf24; } .live.replay i { background: #f59e0b; box-shadow: 0 0 10px #f59e0b; }
  .btns { display: flex; gap: 6px; justify-content: flex-end; margin-top: 8px; }
  .btn { padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font-size: 12px; color: var(--muted); transition: border-color .2s, color .2s, background .2s; }
  .btn:hover { border-color: #334155; color: var(--text); }
  .btn.on { color: #67e8f9; border-color: #155e75; background: #082f49aa; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); padding: 2px; gap: 2px; }
  .seg button { border: 0; background: none; color: var(--muted); font-size: 12px; padding: 3px 10px; border-radius: 999px; transition: background .2s, color .2s; }
  .seg button:hover { color: var(--text); }
  .seg button.on { background: linear-gradient(90deg, #0e7490, #6d28d9); color: white; }
  @keyframes breathe { 50% { opacity: .35; } }

  .legend { zoom: var(--s); position: absolute; left: 24px; bottom: 96px; display: flex; flex-wrap: wrap; gap: 12px; color: var(--muted); font-size: 11.5px; z-index: 2;
    background: var(--panel); border: 1px solid var(--line); padding: 6px 14px; border-radius: 999px; backdrop-filter: blur(8px); max-width: calc(100% - 48px); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
  .legend .sep { width: 1px; background: var(--line); align-self: stretch; }

  /* ---------- timeline ---------- */
  .timeline { position: absolute; left: 0; right: 0; bottom: 0; height: calc(84px * var(--s)); z-index: 2; border-top: 1px solid var(--line);
    background: rgba(6, 10, 20, .85); backdrop-filter: blur(10px); display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 10px 16px; }
  .tl-ctl { zoom: var(--s); display: flex; flex-direction: column; gap: 6px; justify-content: center; width: 112px; }
  .tl-ctl .when { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tl-ctl .row2 { display: flex; gap: 6px; }
  #tl { width: 100%; height: calc(64px * var(--s)); display: block; cursor: ew-resize; border-radius: 8px; }

  /* ---------- tooltip & drawer ---------- */
  .tip { zoom: var(--s); position: absolute; z-index: 4; pointer-events: none; width: 300px; padding: 12px 14px; border-radius: 12px;
    background: rgba(10, 15, 28, .95); border: 1px solid var(--line); box-shadow: 0 12px 40px #000a; opacity: 0; transform: translateY(4px); transition: opacity .15s, transform .15s; }
  .tip.on { opacity: 1; transform: none; }
  .tip .t { font-weight: 650; font-size: 14.5px; }
  .tip .p { color: var(--muted); margin-top: 3px; }
  .tip .d { margin-top: 8px; font-size: 12px; color: #67e8f9; word-break: break-word; }

  .drawer { zoom: var(--s); position: absolute; top: 0; right: 0; bottom: 84px; width: 420px; z-index: 7; background: rgba(8, 12, 24, .96); border-left: 1px solid var(--line);
    backdrop-filter: blur(14px); transform: translateX(105%); transition: transform .35s cubic-bezier(.2, .8, .2, 1); padding: 20px; overflow: auto; box-shadow: -20px 0 60px #0008; }
  .drawer.on { transform: none; }
  .drawer .x { position: sticky; top: 0; float: right; margin: -6px -6px 0 8px; width: 34px; height: 34px; border-radius: 50%; background: #111a2e; border: 1px solid var(--line); color: var(--muted); font-size: 16px; z-index: 1; }
  .drawer .x:hover { color: var(--text); border-color: #334155; }
  .drawer .dmsg { max-height: 380px; overflow: auto; padding-right: 6px; }
  .btn.finish { color: #d9f99d; border-color: #3f6212; }
  .btn.finish:hover { border-color: #65a30d; background: #1a2e05aa; }
  a.btn { display: inline-flex; align-items: center; white-space: nowrap; text-decoration: none; }
  .row .newpill { display: none; margin-right: 6px; padding: 1px 6px; border-radius: 999px; background: var(--wait); color: #1a1205; font-size: 9px; letter-spacing: .08em; }
  .row.unread { border-color: #059669; box-shadow: 0 0 0 1px #10b98155, 0 0 22px #10b98133; animation: rise .45s cubic-bezier(.2, .8, .2, 1) both, glow 2.2s ease-in-out infinite; }
  .row.unread .newpill { display: inline-block; }
  .row.unread .title { color: #a7f3d0; }
  @keyframes glow { 50% { box-shadow: 0 0 0 1px #10b98188, 0 0 30px #10b98155; } }
  .newstat { cursor: pointer; color: #a7f3d0; border-color: #047857; background: #022c22cc; animation: breathe 2.2s ease-in-out infinite; font: inherit; font-size: 12.5px; }
  .newstat b { color: #34d399; }
  .drawer h3 { margin: 0 30px 4px 0; font-size: 18px; }
  .drawer .k { color: var(--dim); font-size: 11px; letter-spacing: .16em; margin: 16px 0 6px; font-weight: 700; }
  .drawer .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .drawer .cell { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .drawer .cell b { display: block; font-size: 16px; }
  .drawer .cell span { color: var(--dim); font-size: 11px; }
  .drawer .file { display: flex; gap: 8px; font-size: 12.5px; padding: 3px 0; align-items: center; }
  .drawer .file i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .drawer .file span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .drawer .file em { margin-left: auto; color: var(--dim); font-style: normal; font-size: 11px; flex: none; }
  .drawer textarea { width: 100%; min-height: 80px; resize: vertical; background: #0b1222; color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font: inherit; }
  .drawer textarea:focus { outline: none; border-color: #155e75; }
  .drawer .acts { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .drawer .primary { background: linear-gradient(90deg, #0891b2, #7c3aed); border: 0; color: white; padding: 7px 16px; border-radius: 999px; font-weight: 600; }
  .drawer .note { color: var(--dim); font-size: 11.5px; margin-top: 6px; }
  .drawer .status { margin-top: 8px; font-size: 12.5px; }

  /* ---------- summary modal ---------- */
  .modal { position: fixed; inset: 0; z-index: 10; background: #000a; display: none; place-items: center; backdrop-filter: blur(4px); }
  .modal.on { display: grid; animation: fade .25s ease both; }
  @keyframes fade { from { opacity: 0 } }
  .sheet { zoom: var(--s); width: min(760px, calc((100vw - 32px) / var(--s))); max-height: calc((100vh - 40px) / var(--s)); overflow: auto; background: #0a1020; border: 1px solid var(--line); border-radius: 18px; padding: 24px 26px; position: relative; animation: pop .35s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes pop { from { transform: translateY(14px) scale(.98); opacity: 0 } }
  .sheet h2 { margin: 0 0 4px; font-size: 22px; letter-spacing: .08em; }
  .sheet .sub { color: var(--dim); margin-bottom: 18px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .tile b { display: block; font-size: 24px; font-weight: 700; }
  .tile span { color: var(--dim); font-size: 12px; }
  .bars { display: grid; gap: 8px; margin-top: 8px; }
  .bar { display: grid; grid-template-columns: 110px 1fr 70px; gap: 10px; align-items: center; font-size: 12.5px; }
  .bar .track { height: 10px; background: #111a2e; border-radius: 99px; overflow: hidden; }
  .bar .fill { height: 100%; border-radius: 99px; width: 0; transition: width 1s cubic-bezier(.2, .8, .2, 1); }
  .bar em { color: var(--dim); font-style: normal; text-align: right; }
  .stack { display: flex; height: 14px; border-radius: 99px; overflow: hidden; margin-top: 8px; }
  .stack div { height: 100%; transition: flex-grow 1s; }

  /* ---------- sidebar ---------- */
  aside { zoom: var(--s); width: 360px; height: calc(100vh / var(--s)); align-self: start; border-left: 1px solid var(--line); background: rgba(7, 11, 22, .85); backdrop-filter: blur(12px); display: grid; grid-template-rows: auto 1fr auto 38%; min-height: 0; }
  aside h2 { margin: 0; padding: 16px 18px 10px; font-size: 11px; letter-spacing: .24em; color: var(--muted); font-weight: 700; }
  .list, .feed { overflow: auto; padding: 0 12px 12px; min-height: 0; }
  .list::-webkit-scrollbar, .feed::-webkit-scrollbar, .drawer::-webkit-scrollbar { width: 7px; }
  .list::-webkit-scrollbar-thumb, .feed::-webkit-scrollbar-thumb, .drawer::-webkit-scrollbar-thumb { background: #1f2a44; border-radius: 8px; }
  .row { position: relative; display: grid; grid-template-columns: 14px 1fr auto; gap: 4px 10px; align-items: center; padding: 10px 12px; margin-bottom: 8px;
    border-radius: 12px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; transition: border-color .2s, background .2s, opacity .3s;
    animation: rise .45s cubic-bezier(.2, .8, .2, 1) both; overflow: hidden; }
  .row:hover, .row.hl { border-color: var(--s); background: #111a30; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  .row .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--s); box-shadow: 0 0 10px var(--s); }
  .row.working .dot { animation: breathe 1s ease-in-out infinite; }
  .row.waiting .dot { animation: breathe 2.4s ease-in-out infinite; }
  .row.sleeping { opacity: .55; }
  .row.sleeping .dot { box-shadow: none; }
  .row .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .badge { font-size: 9.5px; font-weight: 800; letter-spacing: .12em; color: var(--s); }
  .row .sub { grid-column: 2 / 4; display: flex; gap: 8px; font-size: 12px; color: var(--dim); min-width: 0; }
  .row .sub .proj { color: var(--c); font-weight: 600; flex: none; }
  .row .sub .tool { color: var(--t); flex: none; font-weight: 600; }
  .row .sub .doing { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.working .sub .doing { color: #a5f3fc; }
  .row.working::after { content: ''; position: absolute; left: 0; bottom: 0; height: 2px; width: 30%;
    background: linear-gradient(90deg, transparent, var(--t), #fff); animation: scan 1.8s cubic-bezier(.6, 0, .4, 1) infinite; }
  @keyframes scan { from { transform: translateX(-100%) } to { transform: translateX(400%) } }
  .zz { position: absolute; right: 70px; top: 3px; color: var(--sleep); font-size: 11px; font-weight: 700; animation: zz 3s ease-in-out infinite; }
  @keyframes zz { 0% { opacity: 0; transform: translate(0, 6px) } 40% { opacity: 1 } 100% { opacity: 0; transform: translate(6px, -8px) } }
  .cost { color: #fde68a; font-size: 11px; flex: none; }

  .feed { list-style: none; margin: 0; display: grid; gap: 9px; align-content: start; }
  .feed li { font-size: 12px; border-left: 2px solid var(--c); padding: 1px 0 1px 10px; animation: slide .45s cubic-bezier(.2, .8, .2, 1) both; }
  .feed .when { color: var(--dim); font-size: 10.5px; }
  .feed .what { color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @keyframes slide { from { opacity: 0; transform: translateX(14px); } }

  /* ---------- notifications ---------- */
  .notes { zoom: var(--s); position: absolute; top: 120px; right: 16px; width: 400px; max-width: calc(100% / var(--s) - 32px); z-index: 6; display: flex; flex-direction: column; gap: 10px;
    max-height: calc((100% - 120px * var(--s) - 120px * var(--s)) / var(--s)); overflow: auto; padding: 2px; }
  .notes::-webkit-scrollbar { width: 6px; } .notes::-webkit-scrollbar-thumb { background: #1f2a44; border-radius: 8px; }
  .note { background: rgba(10, 15, 28, .97); border: 1px solid #78350f; border-radius: 14px; padding: 12px 14px; flex: none;
    box-shadow: 0 10px 40px #000a, 0 0 24px #f59e0b1f; animation: noteIn .5s cubic-bezier(.2, .8, .2, 1) both; }
  .note.out { animation: noteOut .35s ease both; }
  @keyframes noteIn { from { opacity: 0; transform: translateX(40px) scale(.97); } }
  @keyframes noteOut { to { opacity: 0; transform: translateX(40px); } }
  .note .hd { display: flex; gap: 8px; align-items: center; }
  .note .hd i { width: 9px; height: 9px; border-radius: 50%; background: var(--wait); box-shadow: 0 0 10px var(--wait); flex: none; animation: breathe 1.6s infinite; }
  .note .hd b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .note .hd em { margin-left: auto; color: var(--dim); font-style: normal; font-size: 11px; flex: none; }
  .note .who { color: var(--dim); font-size: 11.5px; margin: 2px 0 0 17px; }
  .note .msg { max-height: 260px; overflow: auto; margin: 10px 0; padding-right: 6px; }
  .note .msg.full { max-height: none; }
  .note .more { background: none; border: 0; color: #67e8f9; font-size: 12px; padding: 0; margin: -4px 0 8px; }
  .note textarea, .rbox textarea { width: 100%; min-height: 54px; resize: vertical; background: #0b1222; color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font: inherit; font-size: 13px; }
  .note textarea:focus, .rbox textarea:focus { outline: none; border-color: #155e75; }
  .note .acts { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
  .note .send { background: linear-gradient(90deg, #0891b2, #7c3aed); border: 0; color: white; padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: 12.5px; }
  .note .st { font-size: 12px; margin-top: 6px; }
  .enable { pointer-events: auto; margin-top: 8px; padding: 6px 12px; border-radius: 999px; border: 1px solid #78350f; background: #451a03cc; color: #fde68a; font-size: 12px; animation: breathe 2.4s infinite; }
  /* the agent's message, lightly formatted */
  .md { font-size: 13px; line-height: 1.5; color: #cbd5e1; word-break: break-word; }
  .md div { min-height: 1px; }
  .md .sp { height: 8px; }
  .md .h { font-weight: 700; color: var(--text); margin-top: 6px; }
  .md .li { padding-left: 14px; text-indent: -10px; }
  .md code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; background: #111a2e; border: 1px solid #1c2740; border-radius: 5px; padding: 0 4px; color: #a5f3fc; }
  .md pre { font-family: ui-monospace, Consolas, monospace; font-size: 12px; background: #0b1222; border: 1px solid #1c2740; border-radius: 8px; padding: 8px 10px; overflow: auto; white-space: pre; color: #a5f3fc; margin: 6px 0; }
  .md b { color: var(--text); }
  .md u { text-decoration-color: #67e8f9; }

  @media (max-width: 900px) { .app { grid-template-columns: 1fr; } aside { display: none; } .drawer { width: 100%; } }
</style>
</head>
<body>
<div class="app">
  <section class="stage" id="stage">
    <canvas id="net"></canvas>
    <header>
      <div>
        <h1>AGENT RADAR</h1>
        <div class="stats">
          <span class="stat"><b id="nWork" style="color:var(--work)">0</b>working</span>
          <span class="stat"><b id="nWait" style="color:var(--wait)">0</b>done</span>
          <span class="stat"><b id="nSleep" style="color:var(--sleep)">0</b>asleep</span>
          <span class="stat"><b id="nCost" style="color:#fde68a">$0</b>spent today</span>
          <button class="stat newstat" id="nNew" hidden title="Open the latest finished agent">✓ <b>0</b> done</button>
        </div>
      </div>
      <div class="right">
        <div class="clock" id="clock">--:--</div>
        <div class="live" id="live"><i></i><span>LIVE</span></div>
        <div class="btns">
          <span class="seg" id="themes"></span>
          <button class="btn" id="bSound" title="Chime and notify when an agent is done">🔔 Alerts</button>
          <button class="btn" id="bMini" title="Small always-on-top window">⧉ Mini</button>
          <button class="btn" id="bToday" title="Today's summary">📊 Today</button>
          <button class="btn" id="bSmaller" title="Smaller">A−</button>
          <button class="btn" id="bBigger" title="Bigger">A+</button>
        </div>
        <button class="enable" id="enable" hidden>🔔 Turn on notifications so you know when an agent is done</button>
      </div>
    </header>
    <div class="legend" id="legend"></div>
    <div class="tip" id="tip"></div>
    <div class="drawer" id="drawer"></div>
    <div class="timeline">
      <div class="tl-ctl">
        <div class="when mono" id="tlWhen">LIVE</div>
        <div class="row2">
          <button class="btn" id="bPlay" title="Replay the last 6 hours">▶ Replay</button>
        </div>
        <div class="row2">
          <button class="btn on" id="bLive">● Live</button>
          <button class="btn" id="bSpeed" title="Replay speed">120×</button>
        </div>
      </div>
      <canvas id="tl"></canvas>
    </div>
  </section>
  <aside>
    <h2>AGENTS</h2>
    <div class="list" id="list"></div>
    <h2>ACTIVITY</h2>
    <ul class="feed" id="feed"></ul>
  </aside>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
// ===================== constants & helpers =====================
const PALETTE = ['#7dd3fc', '#c4b5fd', '#f9a8d4', '#86efac', '#fcd34d', '#fdba74', '#5eead4', '#a5b4fc']
const hue = name => { let h = 0; for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return PALETTE[h % PALETTE.length] }
const hash = s => { let h = 7; for (const ch of s) h = (h * 33 + ch.charCodeAt(0)) >>> 0; return h }
const STATUS = {
  working: { c: '#22d3ee', label: 'WORKING' },
  waiting: { c: '#34d399', label: '✓ DONE' },
  idle: { c: '#94a3b8', label: 'IDLE' },
  sleeping: { c: '#818cf8', label: 'ASLEEP' },
}
// Tool stations: where an agent travels to while it uses that kind of tool.
const TOOLS = {
  think: { label: 'Thinking', glyph: '✦', c: '#22d3ee' },
  read: { label: 'Reading', glyph: '≡', c: '#60a5fa' },
  edit: { label: 'Editing', glyph: '✎', c: '#facc15' },
  bash: { label: 'Terminal', glyph: '>_', c: '#f472b6' },
  web: { label: 'Web', glyph: '⌕', c: '#fb923c' },
  browser: { label: 'Browser', glyph: '◫', c: '#e879f9' },
  agent: { label: 'Agents', glyph: '⚇', c: '#c084fc' },
  work: { label: 'Working', glyph: '◆', c: '#a3e635' },
  other: { label: 'Tools', glyph: '⚙', c: '#94a3b8' },
}
// the status as shown: finishing (wrapping up) and finished (asleep with a final report)
const statusLabel = r => (r.finished ? '💤 FINISHED' : r.finishing ? '🏁 FINISHING' : STATUS[r.status].label)
const toolOf = t => (t === 'user' || !TOOLS[t] ? 'think' : t)
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const clip = (s, n) => (s.length > n ? s.slice(0, n - 1) + '…' : s)
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})` }
const rand = (a, b) => a + Math.random() * (b - a)
const money = n => (n >= 100 ? `$${Math.round(n)}` : `$${n.toFixed(2)}`)
const kfmt = n => (n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(n))
const store = { get: (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v) } catch { return d } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} } }
const timeStr = t => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })

// overall size, changed with A− / A+
let S = store.get('radar.scale', 1.3)
const applyScale = () => document.documentElement.style.setProperty('--s', S)
applyScale()

// Light formatting for an agent's message: headings, bullets, bold, code. Links stay plain text.
function md(src) {
  let s = esc(src)
  const blocks = []
  s = s.replace(/```[^\n]*\n([\s\S]*?)```/g, (_, code) => { blocks.push(code.replace(/\n$/, '')); return `\u0000${blocks.length - 1}\u0000` })
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>')
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
  s = s.replace(/\[([^\]\n]+)\]\(([^)\s]+)\)/g, '<u title="$2">$1</u>')
  s = s.split('\n').map(line => {
    if (/^\u0000\d+\u0000$/.test(line.trim())) return line.trim()
    if (/^#{1,6} /.test(line)) return `<div class="h">${line.replace(/^#+ /, '')}</div>`
    if (/^\s*[-*] /.test(line)) return `<div class="li">• ${line.replace(/^\s*[-*] /, '')}</div>`
    if (/^\s*\d+\. /.test(line)) return `<div class="li">${line.trim()}</div>`
    return line.trim() ? `<div>${line}</div>` : '<div class="sp"></div>'
  }).join('')
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<pre>${blocks[i]}</pre>`)
}
const plain = src => String(src ?? '').replace(/```[\s\S]*?```/g, ' [code] ').replace(/[*`#>]/g, '').replace(/\s+/g, ' ').trim()

document.getElementById('legend').innerHTML =
  Object.entries(STATUS).map(([k, s]) => `<span style="--c:${s.c}"><i></i>${k === 'sleeping' ? 'asleep' : k === 'waiting' ? 'done' : k}</span>`).join('') +
  '<span class="sep"></span>' +
  Object.values(TOOLS).map(t => `<span style="--c:${t.c}"><i></i>${t.label}</span>`).join('')

// ===================== themes =====================
// The drawing is swappable: Solar, Neural network or Simple. Each theme keeps its own
// state and draws the same agents; the rest of the page doesn't care which one is on.
const canvas = document.getElementById('net')
const ctx = canvas.getContext('2d')
let W = 0, H = 0, DPR = 1
const agents = new Map()
let hovered = null, highlighted = null, last = performance.now(), clockT = 0

// The ✓ DONE sign over a finished agent: bright and bobbing until you open it, then calm.
function drawDone(x, y, fresh) {
  const bob = fresh ? Math.sin(clockT * 4) * 1.5 : 0
  if (fresh) {
    const p = (clockT * 0.8) % 1
    ctx.strokeStyle = rgba('#34d399', (1 - p) * 0.7); ctx.lineWidth = 1.4
    ctx.beginPath(); ctx.arc(x, y + bob, 7 + p * 10, 0, 6.29); ctx.stroke(); ctx.lineWidth = 1
    ctx.shadowColor = '#10b981'; ctx.shadowBlur = 12
  }
  ctx.globalAlpha = fresh ? 1 : 0.75
  ctx.fillStyle = '#34d399'
  ctx.beginPath(); ctx.arc(x, y + bob, fresh ? 7 : 5.5, 0, 6.29); ctx.fill()
  ctx.shadowBlur = 0
  ctx.strokeStyle = '#052e1f'; ctx.lineWidth = fresh ? 1.8 : 1.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'
  const k = fresh ? 1 : 0.8
  ctx.beginPath(); ctx.moveTo(x - 3 * k, y + bob); ctx.lineTo(x - 0.8 * k, y + bob + 2.3 * k); ctx.lineTo(x + 3.2 * k, y + bob - 2.4 * k); ctx.stroke()
  ctx.lineWidth = 1; ctx.lineCap = 'butt'; ctx.lineJoin = 'miter'; ctx.globalAlpha = 1
}

// ===================== theme: solar =====================
function makeSolarTheme() {
// Each project is a small solar system: its sun in the middle and one planet per kind
// of tool around it. An agent rests by its sun while it waits or sleeps, and hops to the
// planet of the tool it is using while it works, so it never leaves its own project.
const PLANETS = ['think', 'read', 'edit', 'bash', 'web', 'browser', 'agent', 'work', 'other']
const systems = new Map()  // project -> { x, y, R, tx, ty, tR, spin, dim, flash }
const projectOrder = []    // first-seen order, so systems don't swap places
let stars = []

function build() {
  stars = Array.from({ length: Math.round((W * H) / 2400) }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.1 + 0.2, p: Math.random() * 6.28, s: rand(0.4, 1.4) }))
  layoutSystems(true)
}

function layoutSystems(snap) {
  const all = [...agents.values()]
  const projects = projectOrder.filter(p => all.some(a => a.row.project === p))
  const top = 125, bottom = H - 150, left = 30, right = W - 30
  const n = Math.max(1, projects.length)
  const aspect = (right - left) / Math.max(1, bottom - top)
  const cols = Math.min(n, Math.max(1, Math.round(Math.sqrt(n * aspect))))
  const rows = Math.ceil(n / cols)
  const cw = (right - left) / cols, ch = (bottom - top) / rows
  const baseR = Math.max(50, Math.min(150, Math.min(cw, ch * 1.1) * 0.36))
  projects.forEach((p, i) => {
    const r = Math.floor(i / cols), c = i % cols
    const inRow = r === rows - 1 ? n - r * cols : cols
    const offset = ((cols - inRow) * cw) / 2 // centre a short last row
    const list = all.filter(a => a.row.project === p)
    const busy = list.some(a => a.row.status === 'working' || a.row.status === 'waiting')
    let s = systems.get(p)
    if (!s) { s = { spin: (hash(p) % 628) / 100, flash: {} }; systems.set(p, s); snap = true }
    s.tx = left + offset + cw * (c + 0.5)
    s.ty = top + ch * (r + 0.5)
    s.tR = baseR * (busy ? 1 : 0.7)
    s.dim = !busy
    if (snap || s.R === undefined) { s.x = s.tx; s.y = s.ty; s.R = s.tR }
  })
  for (const p of [...systems.keys()]) if (!projects.includes(p)) systems.delete(p)
}

function planetPos(s, tool) {
  const k = Math.max(0, PLANETS.indexOf(tool))
  const a = s.spin - Math.PI / 2 + (k / PLANETS.length) * Math.PI * 2
  return { x: s.x + Math.cos(a) * s.R, y: s.y + Math.sin(a) * s.R * 0.86 }
}
const sunRadius = s => Math.max(9, s.R * 0.14)

function resetAgent(a) {
  if (!projectOrder.includes(a.row.project)) projectOrder.push(a.row.project)
  layoutSystems(false)
  const s = systems.get(a.row.project)
  a.x = s ? s.x : W / 2; a.y = s ? s.y : H / 2
  a.pang = (hash(a.row.id) % 628) / 100
  a.home = a.pang
  a.trail = []
  a.crew = []
  a.subs = []
  a.tool = null
}

function updateAgent(a, dt) {
  const row = a.row
  const s = systems.get(row.project)
  if (!s) return
  const working = row.status === 'working'
  const tool = toolOf(row.tool)
  let tx, ty
  if (working) {
    if (a.tool !== tool) { a.tool = tool; s.flash[tool] = 1 } // planet lights up as the agent arrives
    // circle the planet; agents sharing a planet take different rings
    const mates = [...agents.values()].filter(b => b.row.project === row.project && b.row.status === 'working' && toolOf(b.row.tool) === tool)
    const k = Math.max(0, mates.indexOf(a))
    a.pang += dt * 2.4
    const p = planetPos(s, tool)
    const r = 13 + k * 6
    tx = p.x + Math.cos(a.pang) * r; ty = p.y + Math.sin(a.pang) * r
  } else {
    a.tool = null
    // rest beside the sun: waiting drifts slowly, sleeping stays put
    a.home += dt * (row.status === 'waiting' ? 0.25 : row.status === 'idle' ? 0.1 : 0)
    const r = sunRadius(s) + 14 + (hash(row.id) % 3) * 7
    tx = s.x + Math.cos(a.home) * r; ty = s.y + Math.sin(a.home) * r * 0.86
  }
  const k = Math.min(1, dt * (working ? 5 : 3))
  a.x += (tx - a.x) * k; a.y += (ty - a.y) * k
  const moving = Math.hypot(tx - a.x, ty - a.y) > 6
  if (moving) { a.trail.push([a.x, a.y]); if (a.trail.length > 14) a.trail.shift() } else if (a.trail.length) a.trail.shift()

  // a few tiny crew dots circle a busy agent
  const want = working ? 3 + Math.min(3, row.subagents.length) : 0
  while (a.crew.filter(c => !c.leaving).length < want) a.crew.push({ ang: Math.random() * 6.28, r: rand(8, 11), spd: rand(2.5, 4) * (Math.random() < 0.5 ? -1 : 1), alpha: 0, size: rand(1, 1.6), leaving: false })
  let extra = a.crew.filter(c => !c.leaving).length - want
  for (const c of a.crew) if (extra > 0 && !c.leaving) { c.leaving = true; extra-- }
  for (const c of a.crew) {
    c.ang += c.spd * dt
    c.alpha = c.leaving ? c.alpha - dt * 1.5 : Math.min(1, c.alpha + dt * 1.5)
    c.x = a.x + Math.cos(c.ang) * c.r; c.y = a.y + Math.sin(c.ang) * c.r
  }
  a.crew = a.crew.filter(c => c.alpha > 0)

  // subagents: small purple moons
  while (a.subs.length < row.subagents.length) a.subs.push({ ang: Math.random() * 6.28 })
  a.subs.length = row.subagents.length
  a.subs.forEach((m, i) => {
    m.ang += (row.subagents[i]?.isActive ? 1.6 : 0.3) * dt
    m.x = a.x + Math.cos(m.ang + i * 2.1) * 17; m.y = a.y + Math.sin(m.ang + i * 2.1) * 17
  })
}

function draw(dt) {
  layoutSystems(false)
  for (const s of systems.values()) {
    const k = Math.min(1, dt * 2.5)
    s.x += (s.tx - s.x) * k; s.y += (s.ty - s.y) * k; s.R += (s.tR - s.R) * k
    s.spin += dt * 0.025
    for (const t in s.flash) s.flash[t] *= Math.pow(0.15, dt)
  }
  for (const a of agents.values()) updateAgent(a, dt)

  // twinkling stars
  for (const st of stars) {
    ctx.fillStyle = `rgba(203, 213, 225, ${0.15 + 0.35 * (0.5 + 0.5 * Math.sin(clockT * st.s + st.p))})`
    ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, 6.29); ctx.fill()
  }
  // faint constellation lines between neighbouring suns
  const sys = [...systems.values()]
  ctx.setLineDash([2, 7]); ctx.strokeStyle = 'rgba(100, 116, 139, .18)'; ctx.lineWidth = 1
  for (let i = 1; i < sys.length; i++) { ctx.beginPath(); ctx.moveTo(sys[i - 1].x, sys[i - 1].y); ctx.lineTo(sys[i].x, sys[i].y); ctx.stroke() }
  ctx.setLineDash([])

  for (const [project, s] of systems) drawSystem(project, s)
  drawAgents()
}

function drawSystem(project, s) {
  const c = hue(project)
  const list = [...agents.values()].filter(a => a.row.project === project)
  const live = list.some(a => a.row.status === 'working')
  const fade = s.dim ? 0.55 : 1
  const sr = sunRadius(s)

  // halo
  const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.R * 1.35)
  g.addColorStop(0, rgba(c, 0.13 * fade)); g.addColorStop(1, rgba(c, 0))
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(s.x, s.y, s.R * 1.35, 0, 6.29); ctx.fill()
  // orbit path
  ctx.strokeStyle = rgba(c, 0.16 * fade); ctx.lineWidth = 1
  ctx.beginPath(); ctx.ellipse(s.x, s.y, s.R, s.R * 0.86, 0, 0, 6.29); ctx.stroke()

  // planets: one per kind of tool
  const busyAt = {}
  for (const a of list) if (a.row.status === 'working') busyAt[toolOf(a.row.tool)] = true
  for (const tool of PLANETS) {
    const T = TOOLS[tool], p = planetPos(s, tool)
    const on = busyAt[tool], fl = s.flash[tool] ?? 0
    const pr = on ? 8.5 : 4.2
    if (on || fl > 0.05) {
      const gg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, pr * 4)
      gg.addColorStop(0, rgba(T.c, 0.35 + fl * 0.4)); gg.addColorStop(1, rgba(T.c, 0))
      ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(p.x, p.y, pr * 4, 0, 6.29); ctx.fill()
    }
    if (fl > 0.05) { // ripple as an agent arrives
      ctx.strokeStyle = rgba(T.c, fl * 0.8); ctx.lineWidth = 1.5
      ctx.beginPath(); ctx.arc(p.x, p.y, pr + (1 - fl) * 22, 0, 6.29); ctx.stroke(); ctx.lineWidth = 1
    }
    ctx.fillStyle = on ? T.c : rgba(T.c, 0.45 * fade)
    ctx.beginPath(); ctx.arc(p.x, p.y, pr, 0, 6.29); ctx.fill()
    if (on) {
      ctx.fillStyle = '#05080f'; ctx.font = `800 ${T.glyph.length > 1 ? 7.5 : 9.5}px ui-monospace, Consolas, monospace`
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(T.glyph, p.x, p.y + 0.5); ctx.textBaseline = 'alphabetic'
      ctx.fillStyle = T.c; ctx.font = '700 10px ui-sans-serif, Segoe UI, sans-serif'
      ctx.fillText(T.label.toUpperCase(), p.x, p.y + pr + 24)
    }
  }

  // the sun, with its cost ring
  const pulse = 1 + (live ? 0.08 : 0.03) * Math.sin(clockT * (live ? 3 : 1.2))
  const sg = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, sr * 2.6 * pulse)
  sg.addColorStop(0, rgba(c, 0.95 * fade)); sg.addColorStop(0.35, rgba(c, 0.45 * fade)); sg.addColorStop(1, rgba(c, 0))
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(s.x, s.y, sr * 2.6 * pulse, 0, 6.29); ctx.fill()
  ctx.fillStyle = '#fff'; ctx.globalAlpha = 0.85 * fade
  ctx.beginPath(); ctx.arc(s.x, s.y, sr * 0.55, 0, 6.29); ctx.fill(); ctx.globalAlpha = 1
  const cost = list.reduce((t, a) => t + (a.row.cost || 0), 0)
  ctx.strokeStyle = 'rgba(253, 230, 138, .12)'; ctx.lineWidth = 2.5
  ctx.beginPath(); ctx.arc(s.x, s.y, sr + 7, 0, 6.29); ctx.stroke()
  if (cost > 0) {
    ctx.strokeStyle = rgba('#fde68a', fade)
    ctx.beginPath(); ctx.arc(s.x, s.y, sr + 7, -Math.PI / 2, -Math.PI / 2 + Math.min(1, cost / 50) * Math.PI * 2); ctx.stroke()
  }
  ctx.lineWidth = 1
  ctx.textAlign = 'center'
  ctx.font = '800 12.5px ui-sans-serif, Segoe UI, sans-serif'; ctx.fillStyle = rgba(c, fade)
  ctx.fillText(project.toUpperCase(), s.x, s.y + sr + 26)
  if (cost > 0) { ctx.font = '600 10px ui-monospace, Consolas, monospace'; ctx.fillStyle = rgba('#fde68a', 0.85 * fade); ctx.fillText(money(cost), s.x, s.y + sr + 39) }
}

function drawAgents() {
  for (const a of agents.values()) {
    const row = a.row, st = STATUS[row.status]
    const tc = TOOLS[toolOf(row.tool)].c
    const working = row.status === 'working'
    const focus = hovered === a || highlighted === row.id || drawerId === row.id
    const x = a.x, y = a.y
    a.drawX = x; a.drawY = y

    // short comet tail while hopping between planets
    for (let i = 1; i < a.trail.length; i++) {
      const [x0, y0] = a.trail[i - 1], [x1, y1] = a.trail[i]
      ctx.strokeStyle = rgba(working ? tc : st.c, (i / a.trail.length) * 0.7); ctx.lineWidth = (i / a.trail.length) * 4
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke()
    }
    ctx.lineWidth = 1
    for (const c of a.crew) { ctx.fillStyle = rgba(tc, 0.8 * c.alpha); ctx.beginPath(); ctx.arc(c.x, c.y, c.size, 0, 6.29); ctx.fill() }
    a.subs.forEach((m, i) => {
      const on = row.subagents[i]?.isActive
      ctx.fillStyle = on ? '#c084fc' : '#64748b'
      ctx.beginPath(); ctx.arc(m.x, m.y, 2.8, 0, 6.29); ctx.fill()
    })

    const r = focus ? 7 : 5.5
    const g = ctx.createRadialGradient(x, y, 0, x, y, r * 4)
    g.addColorStop(0, rgba(working ? tc : st.c, working ? 0.55 : 0.28)); g.addColorStop(1, rgba(st.c, 0))
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 4, 0, 6.29); ctx.fill()
    ctx.fillStyle = row.status === 'sleeping' ? 'rgba(129,140,248,.6)' : st.c
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.29); ctx.fill()
    if (working) { ctx.fillStyle = tc; ctx.beginPath(); ctx.arc(x, y, r * 0.55, 0, 6.29); ctx.fill() }

    if (row.status === 'sleeping') {
      for (let z = 0; z < 3; z++) {
        const p = (clockT * 0.35 + z / 3) % 1
        ctx.fillStyle = rgba(st.c, Math.sin(p * Math.PI) * 0.8)
        ctx.font = `700 ${8 + z * 2}px ui-sans-serif, Segoe UI, sans-serif`; ctx.textAlign = 'left'
        ctx.fillText('z', x + 7 + p * 10, y - 5 - p * 15)
      }
    }
    if (!row.finishing && (row.status === 'waiting' || notes.has(row.id))) drawDone(x, y - 16, notes.has(row.id))
    if (focus) { ctx.strokeStyle = st.c; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, y, 13, 0, 6.29); ctx.stroke(); ctx.lineWidth = 1 }
    // names only for agents doing something (or the one you point at), to keep it calm
    if (working || row.status === 'waiting' || focus) {
      const text = clip(row.title, 24)
      ctx.font = '600 11px ui-sans-serif, Segoe UI, sans-serif'; ctx.textAlign = 'left'
      const tw = ctx.measureText(text).width
      ctx.fillStyle = 'rgba(5, 8, 15, .82)'
      ctx.beginPath(); ctx.roundRect(x + 12, y - 8.5, tw + 12, 17, 8.5); ctx.fill()
      ctx.strokeStyle = rgba(working ? tc : st.c, 0.5); ctx.stroke()
      ctx.fillStyle = '#e2e8f0'; ctx.fillText(text, x + 18, y + 3.5)
    }
  }
}
  return { build, reset: resetAgent, draw }
}

// ===================== theme: neural network =====================
// Agents travel across the network to the station of the tool they are using.
function makeNetworkTheme() {
let neurons = []            // { x, y, fire, fireC, nb, phase }
let edges = new Map()       // "a-b" -> { a, b, glow, color }
let stations = {}           // tool -> neuron index
const hubs = new Map()      // project -> neuron index
let distCache = new Map()   // target neuron -> hop distances
let signals = []
const edgeKey = (a, b) => (a < b ? `${a}-${b}` : `${b}-${a}`)

function nearestFree(x, y, taken) {
  let best = 0, bd = Infinity
  neurons.forEach((n, i) => {
    if (taken.has(i)) return
    const d = Math.hypot(n.x - x, n.y - y)
    if (d < bd) { bd = d; best = i }
  })
  taken.add(best)
  return best
}

function build() {

  const top = 130, bottom = H - 180, left = 60, right = W - 60
  const cols = Math.max(5, Math.round((right - left) / 92))
  const rows = Math.max(4, Math.round((bottom - top) / 78))
  const gx = (right - left) / (cols - 1), gy = (bottom - top) / (rows - 1)
  neurons = []
  const at = []
  for (let c = 0; c < cols; c++) {
    at[c] = []
    for (let r = 0; r < rows; r++) {
      const x = left + c * gx + rand(-gx, gx) * 0.2
      const y = top + r * gy + (c % 2 ? gy * 0.3 : 0) + rand(-gy, gy) * 0.18
      at[c][r] = neurons.length
      neurons.push({ x, y, fire: 0, fireC: '#67e8f9', nb: [], phase: Math.random() * 6.28 })
    }
  }
  edges = new Map()
  const link = (a, b) => {
    if (a === undefined || b === undefined || a === b) return
    const k = edgeKey(a, b)
    if (edges.has(k)) return
    edges.set(k, { a, b, glow: 0, color: '#22d3ee' })
    neurons[a].nb.push(b); neurons[b].nb.push(a)
  }
  for (let c = 0; c < cols; c++) for (let r = 0; r < rows; r++) {
    const i = at[c][r]
    if (r + 1 < rows) link(i, at[c][r + 1])
    if (c + 1 < cols) {
      link(i, at[c + 1][r])
      if (r + 1 < rows && Math.random() < 0.5) link(i, at[c + 1][r + 1])
      if (r > 0 && Math.random() < 0.35) link(i, at[c + 1][r - 1])
    }
  }

  // tool stations on an outer ring, Thinking in the middle
  const taken = new Set()
  const cx = (left + right) / 2, cy = (top + bottom) / 2
  const rx = (right - left) / 2 * 0.9, ry = (bottom - top) / 2 * 0.88
  stations = { think: nearestFree(cx, cy, taken) }
  const ring = ['bash', 'web', 'browser', 'agent', 'work', 'other', 'read', 'edit']
  ring.forEach((t, k) => {
    const a = -Math.PI / 2 + (k / ring.length) * Math.PI * 2
    stations[t] = nearestFree(cx + Math.cos(a) * rx, cy + Math.sin(a) * ry, taken)
  })
  hubTaken = taken
  hubs.clear()
  distCache = new Map()
  for (const a of agents.values()) resetAgent(a)
}

// project hubs sit on an inner ring between the stations
let hubTaken = new Set()
function hubFor(project) {
  if (hubs.has(project)) return hubs.get(project)
  const k = hubs.size
  const top = 130, bottom = H - 180, left = 60, right = W - 60
  const cx = (left + right) / 2, cy = (top + bottom) / 2
  const a = -Math.PI / 2 + Math.PI / 7 + k * (Math.PI * 2 / 6) + Math.floor(k / 6) * 0.5
  const rr = 0.5 + Math.floor(k / 6) * 0.12
  const i = nearestFree(cx + Math.cos(a) * (right - left) / 2 * rr, cy + Math.sin(a) * (bottom - top) / 2 * rr, hubTaken)
  hubs.set(project, i)
  return i
}

function distTo(target) {
  let d = distCache.get(target)
  if (d) return d
  d = new Array(neurons.length).fill(Infinity)
  d[target] = 0
  const q = [target]
  while (q.length) {
    const u = q.shift()
    for (const v of neurons[u].nb) if (d[v] === Infinity) { d[v] = d[u] + 1; q.push(v) }
  }
  distCache.set(target, d)
  return d
}

// ===================== walkers =====================
// A walker hops neuron to neuron. mode 'go': head to target, then roam near it.
// 'home': roam slowly near target. 'rest': go to target and stop there.
function walker(node) { return { node, next: node, t: 1, x: neurons[node].x, y: neurons[node].y, trail: [], alpha: 1 } }

function chooseNext(w, target, mode, roam) {
  const d = distTo(target)
  const here = d[w.node]
  const nb = neurons[w.node].nb
  if (mode === 'rest' && here === 0) return w.node
  if (here > roam) {
    const closer = nb.filter(j => d[j] < here)
    return closer[(Math.random() * closer.length) | 0] ?? w.node
  }
  const near = nb.filter(j => d[j] <= roam)
  return near[(Math.random() * near.length) | 0] ?? w.node
}

function stepWalker(w, target, mode, speed, color, dt, fires) {
  if (w.t >= 1) {
    w.node = w.next
    if (fires) { const n = neurons[w.node]; n.fire = 1; n.fireC = color }
    w.next = chooseNext(w, target, mode, mode === 'go' ? 2 : 1)
    w.t = w.next === w.node ? 1 : 0
    const e = edges.get(edgeKey(w.node, w.next))
    if (e && fires) { e.glow = 1; e.color = color }
  }
  if (w.next !== w.node) w.t = Math.min(1, w.t + dt * speed)
  const a = neurons[w.node], b = neurons[w.next]
  const t = w.t, ease = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2
  w.x = a.x + (b.x - a.x) * ease
  w.y = a.y + (b.y - a.y) * ease
  if (fires) { w.trail.push([w.x, w.y]); if (w.trail.length > 22) w.trail.shift() }
  else if (w.trail.length) w.trail.shift()
}

// ===================== agents =====================
function resetAgent(a) {
  const hub = hubFor(a.row.project)
  a.main = walker(hub)
  a.swarm = []
  a.subs = []
}
function agentTarget(row) {
  return row.status === 'working' ? stations[toolOf(row.tool)] : hubFor(row.project)
}

function updateAgent(a, dt) {
  const row = a.row
  const tool = toolOf(row.tool)
  const tc = TOOLS[tool].c
  const working = row.status === 'working'
  const target = agentTarget(row)
  const mode = working ? 'go' : row.status === 'sleeping' ? 'rest' : 'home'
  const speed = working ? 2.3 : row.status === 'sleeping' ? 0.8 : row.status === 'waiting' ? 0.25 : 0.15
  stepWalker(a.main, target, mode, speed, tc, dt, working)

  // the swarm: extra dots that fly with a working agent to its station
  const want = working ? 5 + Math.min(4, row.subagents.length * 2) : 0
  while (a.swarm.filter(s => !s.leaving).length < want) {
    const s = walker(a.main.node)
    s.speed = rand(1.5, 3.2); s.leaving = false; s.alpha = 0; s.size = rand(1.6, 2.8)
    a.swarm.push(s)
  }
  let extra = a.swarm.filter(s => !s.leaving).length - want
  for (const s of a.swarm) if (extra > 0 && !s.leaving) { s.leaving = true; extra-- }
  for (const s of a.swarm) {
    if (s.leaving) {
      stepWalker(s, a.main.node, 'rest', 3, tc, dt, false)
      s.alpha -= dt * 0.8
    } else {
      s.alpha = Math.min(1, s.alpha + dt * 1.5)
      stepWalker(s, target, 'go', s.speed, tc, dt, true)
    }
  }
  a.swarm = a.swarm.filter(s => s.alpha > 0)

  // subagents: purple walkers that go to their own tool's station
  while (a.subs.length < row.subagents.length) a.subs.push(walker(a.main.node))
  a.subs.length = row.subagents.length
  a.subs.forEach((s, k) => {
    const sa = row.subagents[k]
    const st = sa.isActive ? stations[toolOf(sa.tool)] : a.main.node
    stepWalker(s, st, sa.isActive ? 'go' : 'rest', sa.isActive ? 2 : 1, '#c084fc', dt, sa.isActive)
  })
}

// ===================== drawing =====================
function draw(dt) {
  for (const a of agents.values()) updateAgent(a, dt)

  if (Math.random() < dt * 7 && edges.size) {
    const list = [...edges.values()]
    const e = list[(Math.random() * list.length) | 0]
    signals.push(Math.random() < .5 ? { a: e.a, b: e.b, t: 0, speed: rand(.4, .9) } : { a: e.b, b: e.a, t: 0, speed: rand(.4, .9) })
  }

  // edges
  ctx.lineWidth = 1
  ctx.strokeStyle = 'rgba(56, 78, 120, .2)'
  ctx.beginPath()
  for (const e of edges.values()) { const a = neurons[e.a], b = neurons[e.b]; ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y) }
  ctx.stroke()
  for (const e of edges.values()) {
    if (e.glow < 0.02) continue
    const a = neurons[e.a], b = neurons[e.b]
    ctx.strokeStyle = rgba(e.color, e.glow * .7)
    ctx.lineWidth = 1 + e.glow * 1.6
    ctx.shadowColor = e.color; ctx.shadowBlur = 10 * e.glow
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke()
    ctx.shadowBlur = 0; ctx.lineWidth = 1
    e.glow *= Math.pow(0.3, dt)
  }

  // signals
  signals = signals.filter(s => s.t < 1)
  ctx.fillStyle = 'rgba(103, 232, 249, .5)'
  for (const s of signals) {
    s.t += dt * s.speed
    const a = neurons[s.a], b = neurons[s.b]
    ctx.beginPath(); ctx.arc(a.x + (b.x - a.x) * s.t, a.y + (b.y - a.y) * s.t, 1.5, 0, 6.29); ctx.fill()
  }

  // neurons
  for (const n of neurons) {
    const base = 2 + Math.sin(clockT * 1.3 + n.phase) * 0.5
    if (n.fire > 0.02) {
      ctx.fillStyle = rgba(n.fireC, n.fire * .22)
      ctx.beginPath(); ctx.arc(n.x, n.y, base + 14 * (1 - n.fire) + 4, 0, 6.29); ctx.fill()
      n.fire *= Math.pow(0.25, dt)
    }
    ctx.fillStyle = n.fire > .1 ? rgba(n.fireC, .5 + n.fire * .5) : 'rgba(71, 98, 145, .65)'
    ctx.beginPath(); ctx.arc(n.x, n.y, base + n.fire * 2, 0, 6.29); ctx.fill()
  }

  drawStations()
  drawHubs()

  // swarms and subagents under the agents
  for (const a of agents.values()) {
    const tc = TOOLS[toolOf(a.row.tool)].c
    for (const s of a.swarm) drawDot(s, tc, s.size, s.alpha)
    a.subs.forEach((s, k) => drawDot(s, '#c084fc', 3.2, 1, a.row.subagents[k]?.isActive))
  }
  drawAgents()
}

function drawStations() {
  const visitors = {}
  for (const a of agents.values()) if (a.row.status === 'working') { const t = toolOf(a.row.tool); visitors[t] = (visitors[t] ?? 0) + 1 }
  for (const [tool, i] of Object.entries(stations)) {
    const n = neurons[i], T = TOOLS[tool], busy = visitors[tool] ?? 0
    const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, busy ? 90 : 55)
    g.addColorStop(0, rgba(T.c, busy ? .2 : .08)); g.addColorStop(1, rgba(T.c, 0))
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(n.x, n.y, busy ? 90 : 55, 0, 6.29); ctx.fill()
    // rotating dashed ring
    ctx.save(); ctx.translate(n.x, n.y); ctx.rotate(clockT * (busy ? 1.2 : 0.25))
    ctx.setLineDash([5, 6]); ctx.strokeStyle = rgba(T.c, busy ? .9 : .4); ctx.lineWidth = 1.5
    ctx.beginPath(); ctx.arc(0, 0, 24, 0, 6.29); ctx.stroke(); ctx.restore(); ctx.setLineDash([])
    if (busy) {
      const p = (clockT * 1.1) % 1
      ctx.strokeStyle = rgba(T.c, (1 - p) * .7); ctx.lineWidth = 2
      ctx.beginPath(); ctx.arc(n.x, n.y, 24 + p * 26, 0, 6.29); ctx.stroke()
    }
    ctx.fillStyle = 'rgba(6, 10, 20, .9)'; ctx.strokeStyle = rgba(T.c, .9); ctx.lineWidth = 1.5
    ctx.beginPath(); ctx.arc(n.x, n.y, 17, 0, 6.29); ctx.fill(); ctx.stroke()
    ctx.fillStyle = T.c; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
    ctx.font = `700 ${T.glyph.length > 1 ? 12 : 16}px ui-monospace, Consolas, monospace`
    ctx.fillText(T.glyph, n.x, n.y + 1)
    ctx.textBaseline = 'alphabetic'
    ctx.font = '700 11px ui-sans-serif, Segoe UI, sans-serif'
    ctx.fillText(T.label.toUpperCase() + (busy ? ` · ${busy}` : ''), n.x, n.y + 40)
    ctx.lineWidth = 1
  }
}

function drawHubs() {
  for (const [project, i] of hubs) {
    const n = neurons[i], c = hue(project)
    const list = [...agents.values()].filter(a => a.row.project === project)
    const live = list.some(a => a.row.status === 'working')
    const cost = list.reduce((s, a) => s + (a.row.cost || 0), 0)
    const pulse = (clockT * (live ? .9 : .35)) % 1
    ctx.strokeStyle = rgba(c, (1 - pulse) * (live ? .6 : .25)); ctx.lineWidth = 1.5
    ctx.beginPath(); ctx.arc(n.x, n.y, 14 + pulse * 26, 0, 6.29); ctx.stroke()
    // cost ring: a full circle is $50
    ctx.strokeStyle = 'rgba(253, 230, 138, .15)'; ctx.lineWidth = 3
    ctx.beginPath(); ctx.arc(n.x, n.y, 21, 0, 6.29); ctx.stroke()
    if (cost > 0) {
      ctx.strokeStyle = '#fde68a'; ctx.shadowColor = '#fbbf24'; ctx.shadowBlur = 8
      ctx.beginPath(); ctx.arc(n.x, n.y, 21, -Math.PI / 2, -Math.PI / 2 + Math.min(1, cost / 50) * Math.PI * 2); ctx.stroke()
      ctx.shadowBlur = 0
    }
    ctx.lineWidth = 1.5
    ctx.fillStyle = rgba(c, .18); ctx.strokeStyle = rgba(c, .85)
    ctx.beginPath(); ctx.arc(n.x, n.y, 13, 0, 6.29); ctx.fill(); ctx.stroke()
    ctx.fillStyle = c; ctx.beginPath(); ctx.arc(n.x, n.y, 4.5, 0, 6.29); ctx.fill()
    ctx.font = '800 12.5px ui-sans-serif, Segoe UI, sans-serif'; ctx.textAlign = 'center'
    ctx.fillText(project.toUpperCase(), n.x, n.y + 38)
    if (cost > 0) { ctx.font = '600 10.5px ui-monospace, Consolas, monospace'; ctx.fillStyle = '#fde68a'; ctx.fillText(money(cost), n.x, n.y + 51) }
    ctx.lineWidth = 1
    drawFiles(project, n, list)
  }
}

// files the project's agents touched, orbiting its hub
function drawFiles(project, n, list) {
  const files = []
  for (const a of list) for (const f of a.row.files ?? []) if (!files.some(x => x.path === f.path)) files.push({ ...f, agent: a })
  files.sort((x, y) => x.ageS - y.ageS)
  files.slice(0, 6).forEach(f => {
    const ang = (hash(f.path) % 628) / 100 + clockT * 0.12
    const r = 62 + (hash(f.name) % 3) * 9
    const x = n.x + Math.cos(ang) * r, y = n.y + Math.sin(ang) * r * 0.8
    const c = f.op === 'edit' ? TOOLS.edit.c : TOOLS.read.c
    const hot = f.ageS < 15
    if (hot) {
      const src = f.agent.main
      ctx.strokeStyle = rgba(c, .5); ctx.setLineDash([3, 4])
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(src.x, src.y); ctx.stroke(); ctx.setLineDash([])
      ctx.shadowColor = c; ctx.shadowBlur = 14
    }
    ctx.fillStyle = rgba(c, hot ? 1 : .55)
    const s = hot ? 8 : 6
    ctx.beginPath(); ctx.roundRect(x - s / 2, y - s / 2, s, s, 2); ctx.fill()
    ctx.shadowBlur = 0
    if (hot || f.ageS < 120) {
      ctx.font = '500 10px ui-monospace, Consolas, monospace'; ctx.textAlign = 'left'
      ctx.fillStyle = rgba(c, hot ? .95 : .55)
      ctx.fillText(clip(f.name, 22), x + 8, y + 3)
    }
  })
}

function drawDot(w, color, r, alpha = 1, busy = true) {
  ctx.globalAlpha = Math.max(0, alpha)
  if (w.trail.length > 1) {
    for (let i = 1; i < w.trail.length; i++) {
      const [x0, y0] = w.trail[i - 1], [x1, y1] = w.trail[i]
      ctx.strokeStyle = rgba(color, (i / w.trail.length) * .55)
      ctx.lineWidth = (i / w.trail.length) * r
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke()
    }
    ctx.lineWidth = 1
  }
  ctx.fillStyle = rgba(color, busy ? .35 : .15)
  ctx.beginPath(); ctx.arc(w.x, w.y, r * 2.6, 0, 6.29); ctx.fill()
  ctx.fillStyle = color
  ctx.beginPath(); ctx.arc(w.x, w.y, r, 0, 6.29); ctx.fill()
  ctx.globalAlpha = 1
}

function drawAgents() {
  const sleepers = new Map()
  for (const a of agents.values()) {
    const row = a.row, st = STATUS[row.status], w = a.main
    const tc = TOOLS[toolOf(row.tool)].c
    const focus = hovered === a || highlighted === row.id || drawerId === row.id
    let x = w.x, y = w.y
    if (row.status === 'sleeping' && w.node === hubFor(row.project) && w.t >= 1) {
      const k = sleepers.get(row.project) ?? 0
      sleepers.set(row.project, k + 1)
      const ang = Math.PI * 0.75 + k * 0.9
      x += Math.cos(ang) * 28; y += Math.sin(ang) * 28
    }
    a.drawX = x; a.drawY = y
    const working = row.status === 'working'
    // trail in the tool's colour
    if (w.trail.length > 1) {
      for (let i = 1; i < w.trail.length; i++) {
        const [x0, y0] = w.trail[i - 1], [x1, y1] = w.trail[i]
        ctx.strokeStyle = rgba(tc, (i / w.trail.length) * .8); ctx.lineWidth = (i / w.trail.length) * 6
        ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke()
      }
      ctx.lineWidth = 1
    }
    const r = focus ? 8 : 6.5
    const g = ctx.createRadialGradient(x, y, 0, x, y, r * 4.5)
    g.addColorStop(0, rgba(working ? tc : st.c, working ? .6 : .3)); g.addColorStop(1, rgba(st.c, 0))
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 4.5, 0, 6.29); ctx.fill()
    ctx.fillStyle = st.c; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.29); ctx.fill()
    if (working) { ctx.fillStyle = tc; ctx.beginPath(); ctx.arc(x, y, r * .55, 0, 6.29); ctx.fill() }
    ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(x - r * .3, y - r * .3, r * .3, 0, 6.29); ctx.fill()

    if (!row.finishing && (row.status === 'waiting' || notes.has(row.id))) drawDone(x, y - 16, notes.has(row.id))
    if (row.status === 'sleeping') {
      for (let z = 0; z < 3; z++) {
        const p = ((clockT * .35) + z / 3) % 1
        ctx.fillStyle = rgba(st.c, Math.sin(p * Math.PI) * .9)
        ctx.font = `700 ${9 + z * 2}px ui-sans-serif, Segoe UI, sans-serif`; ctx.textAlign = 'left'
        ctx.fillText('z', x + 8 + p * 12, y - 6 - p * 18)
      }
    }
    if (focus) {
      ctx.strokeStyle = st.c; ctx.lineWidth = 1.5
      ctx.beginPath(); ctx.arc(x, y, 15, 0, 6.29); ctx.stroke(); ctx.lineWidth = 1
    }
    if (row.status !== 'sleeping' || focus) {
      const text = clip(row.title, 26) + (working ? `  ·  ${TOOLS[toolOf(row.tool)].label}` : '')
      ctx.font = '600 11.5px ui-sans-serif, Segoe UI, sans-serif'; ctx.textAlign = 'left'
      const tw = ctx.measureText(text).width
      ctx.fillStyle = 'rgba(5, 8, 15, .82)'
      ctx.beginPath(); ctx.roundRect(x + 13, y - 9, tw + 14, 18, 9); ctx.fill()
      ctx.strokeStyle = rgba(working ? tc : st.c, .55); ctx.stroke()
      ctx.fillStyle = '#e2e8f0'; ctx.fillText(text, x + 20, y + 4)
    }
  }
}
  return { build, reset: resetAgent, draw }
}

// ===================== theme: simple =====================
// A calm board: one panel per project listing its agents, what each is doing and
// with which tool. Nothing travels; only small pulses show activity.
function makeSimpleTheme() {
  const panels = new Map() // project -> { x, y, w, h, tx, ty, th, alpha }
  const order = []
  const ROW = 50, HEAD = 42, PAD = 10, GAP = 16
  const rank = { working: 0, waiting: 1, idle: 2, sleeping: 3 }

  function fit(text, maxW) {
    if (ctx.measureText(text).width <= maxW) return text
    let t = text
    while (t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1)
    return t + '…'
  }
  function layout(snap) {
    const all = [...agents.values()]
    for (const a of all) if (!order.includes(a.row.project)) order.push(a.row.project)
    const projects = order.filter(p => all.some(a => a.row.project === p))
    const top = 120, left = 24, right = W - 24
    const cols = Math.max(1, Math.min(projects.length, Math.floor((right - left + GAP) / (320 + GAP))))
    const cw = (right - left - (cols - 1) * GAP) / cols
    const heights = new Array(cols).fill(top)
    for (const p of projects) {
      const n = all.filter(a => a.row.project === p).length
      const h = HEAD + n * ROW + PAD
      const c = heights.indexOf(Math.min(...heights))
      let s = panels.get(p)
      if (!s) { s = { alpha: 0 }; panels.set(p, s) }
      s.tx = left + c * (cw + GAP); s.ty = heights[c]; s.w = cw; s.th = h
      if (snap || s.x === undefined) { s.x = s.tx; s.y = s.ty; s.h = s.th }
      heights[c] += h + GAP
    }
    for (const p of [...panels.keys()]) if (!projects.includes(p)) panels.delete(p)
  }
  function build() { layout(true) }
  function reset(a) { a.hitBox = null; layout(false) }

  function draw(dt) {
    layout(false)
    const all = [...agents.values()]
    for (const [p, s] of panels) {
      const k = Math.min(1, dt * 6)
      s.x += (s.tx - s.x) * k; s.y += (s.ty - s.y) * k; s.h += (s.th - s.h) * k
      s.alpha = Math.min(1, s.alpha + dt * 2.5)
      const c = hue(p)
      const list = all.filter(a => a.row.project === p).sort((a, b) => rank[a.row.status] - rank[b.row.status] || (a.row.title < b.row.title ? -1 : 1))
      const live = list.some(a => a.row.status === 'working')
      ctx.globalAlpha = s.alpha

      // panel
      ctx.fillStyle = 'rgba(13, 19, 34, .88)'
      ctx.strokeStyle = rgba(c, live ? 0.55 + 0.2 * Math.sin(clockT * 2.5) : 0.3)
      ctx.lineWidth = 1.2
      ctx.beginPath(); ctx.roundRect(s.x, s.y, s.w, s.h, 14); ctx.fill(); ctx.stroke()
      const bar = ctx.createLinearGradient(s.x, 0, s.x + s.w, 0)
      bar.addColorStop(0, rgba(c, 0)); bar.addColorStop(0.5, rgba(c, live ? 0.9 : 0.45)); bar.addColorStop(1, rgba(c, 0))
      ctx.fillStyle = bar; ctx.fillRect(s.x + 14, s.y, s.w - 28, 2)

      // header
      ctx.textAlign = 'left'; ctx.font = '800 13px ui-sans-serif, Segoe UI, sans-serif'; ctx.fillStyle = c
      ctx.fillText(p.toUpperCase(), s.x + 16, s.y + 26)
      const cost = list.reduce((t, a) => t + (a.row.cost || 0), 0)
      ctx.textAlign = 'right'; ctx.font = '600 11px ui-monospace, Consolas, monospace'
      ctx.fillStyle = '#fde68a'; ctx.fillText(cost ? money(cost) : '', s.x + s.w - 16, s.y + 26)

      list.forEach((a, i) => {
        const row = a.row, st = STATUS[row.status], T = TOOLS[toolOf(row.tool)]
        const ry = s.y + HEAD + i * ROW
        const working = row.status === 'working'
        const focus = hovered === a || highlighted === row.id || drawerId === row.id
        const unread = notes.has(row.id)
        a.hitBox = { x: s.x, y: ry, w: s.w, h: ROW }
        a.drawX = s.x + 22; a.drawY = ry + 17

        if (focus || unread) {
          ctx.fillStyle = unread ? 'rgba(52, 211, 153, .10)' : 'rgba(148, 163, 184, .07)'
          ctx.beginPath(); ctx.roundRect(s.x + 6, ry + 2, s.w - 12, ROW - 4, 10); ctx.fill()
        }
        if (i > 0) { ctx.fillStyle = 'rgba(31, 42, 68, .7)'; ctx.fillRect(s.x + 16, ry, s.w - 32, 1) }

        // status dot
        const dx = s.x + 22, dy = ry + 17
        if (working || row.status === 'waiting') {
          const pp = (clockT * (working ? 1.1 : 0.6)) % 1
          ctx.strokeStyle = rgba(st.c, (1 - pp) * 0.7); ctx.lineWidth = 1.3
          ctx.beginPath(); ctx.arc(dx, dy, 5 + pp * 9, 0, 6.29); ctx.stroke(); ctx.lineWidth = 1
        }
        ctx.fillStyle = row.status === 'sleeping' ? 'rgba(129,140,248,.55)' : st.c
        ctx.beginPath(); ctx.arc(dx, dy, 5, 0, 6.29); ctx.fill()

        // title and status
        const right = s.x + s.w - 16
        ctx.textAlign = 'right'; ctx.font = '800 9.5px ui-sans-serif, Segoe UI, sans-serif'; ctx.fillStyle = row.finishing ? TOOLS.work.c : st.c
        ctx.fillText(statusLabel(row), right, ry + 21)
        let badgeW = ctx.measureText(statusLabel(row)).width
        ctx.textAlign = 'left'; ctx.font = '650 12.5px ui-sans-serif, Segoe UI, sans-serif'
        ctx.fillStyle = row.status === 'sleeping' ? '#64748b' : unread ? '#a7f3d0' : '#e2e8f0'
        ctx.fillText(fit(row.title, right - badgeW - 12 - (s.x + 36)), s.x + 36, ry + 22)

        // second line: tool chip + what it is doing
        let x2 = s.x + 36
        if (working) {
          ctx.font = '700 10px ui-sans-serif, Segoe UI, sans-serif'
          const tw = ctx.measureText(T.label).width + 14
          ctx.fillStyle = rgba(T.c, 0.18); ctx.beginPath(); ctx.roundRect(x2, ry + 29, tw, 15, 7.5); ctx.fill()
          ctx.fillStyle = T.c; ctx.fillText(T.label, x2 + 7, ry + 40)
          x2 += tw + 8
        }
        ctx.font = '500 11px ui-monospace, Consolas, monospace'
        ctx.fillStyle = working ? '#a5f3fc' : '#64748b'
        const doing = row.status === 'sleeping' ? 'asleep · ' + row.ago : row.doing
        ctx.fillText(fit(doing, right - x2), x2, ry + 40)

        // a soft sweep under a working row
        if (working) {
          const sweep = ((clockT * 0.45) % 1) * (s.w - 32)
          const g = ctx.createLinearGradient(s.x + 16 + sweep - 60, 0, s.x + 16 + sweep, 0)
          g.addColorStop(0, rgba(T.c, 0)); g.addColorStop(1, rgba(T.c, 0.8))
          ctx.fillStyle = g; ctx.fillRect(Math.max(s.x + 16, s.x + 16 + sweep - 60), ry + ROW - 3, Math.min(60, sweep), 1.5)
        }
      })
      ctx.globalAlpha = 1
    }
  }
  function hit(mx, my) {
    for (const a of agents.values()) {
      const b = a.hitBox
      if (b && mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) return a
    }
    return null
  }
  return { build, reset, draw, hit }
}

function sizeCanvas() {
  const rect = canvas.getBoundingClientRect()
  DPR = window.devicePixelRatio || 1
  // draw in "logical" units scaled by S, so A+ makes everything bigger
  W = rect.width / S; H = rect.height / S
  canvas.width = rect.width * DPR; canvas.height = rect.height * DPR
  ctx.setTransform(DPR * S, 0, 0, DPR * S, 0, 0)
}
// called on load, on resize and by A−/A+

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000)
  last = now
  clockT += dt
  if (replay.on && replay.playing) advanceReplay(dt)
  ctx.clearRect(0, 0, W, H)
  theme.draw(dt)
  if (mini.ctx) drawMini()
  requestAnimationFrame(frame)
}

const tip = document.getElementById('tip')
function agentAt(mx, my) {
  if (theme.hit) return theme.hit(mx, my)
  let best = null, bd = 22
  for (const a of agents.values()) {
    const d = Math.hypot((a.drawX ?? 0) - mx, (a.drawY ?? 0) - my)
    if (d < bd) { bd = d; best = a }
  }
  return best
}
canvas.addEventListener('mousemove', ev => {

const post = (url, data) => fetch(url, { method: 'POST', headers: { 'content-type': 'application/json', 'x-radar': '1' }, body: JSON.stringify(data) }).then(r => r.json())
// Sends a reply through the server and the mod. `where` is the status element,
// or a function that finds it. Resolves true once delivered.
async function sendReply(id, text, where) {
  text = String(text ?? '').trim()
  const st = () => (typeof where === 'function' ? where() : where)
  const say = html => { const el = st(); if (el) el.innerHTML = html }
  if (!text) { say('<span style="color:var(--dim)">Type a reply first.</span>'); return false }
  say('<span style="color:var(--muted)">Sending…</span>')
  const { rid, error } = await post('/reply', { id, text }).catch(e => ({ error: String(e) }))
  if (error) { say(`<span style="color:#f87171">${esc(error)}</span>`); return false }
  for (let i = 0; i < 30; i++) {
    await new Promise(r => setTimeout(r, 1000))
    const s = await fetch('/reply-status?rid=' + rid).then(r => r.json()).catch(() => ({}))
    if ('ok' in s) {
      const reason = /auto mode classifier/i.test(s.reason ?? '') ? 'auto mode in the session running the radar blocks replies sent by the mod.' + blockedHint : (s.reason ?? 'unknown')
      say(s.ok ? '<span style="color:#4ade80">✓ Delivered to the session</span>' : `<span style="color:#f87171">Not delivered: ${esc(reason)}</span>`)
      return !!s.ok
    }
  }
  say('<span style="color:#fbbf24">Still waiting: is a Claude Code session with the Agent Radar mod open?</span>')
  return false
}

async function finishWork(id, where) {
  const st = () => (typeof where === 'function' ? where() : where)
  const say = html => { const el = st(); if (el) el.innerHTML = html }
  say('<span style="color:var(--muted)">Asking it to tidy up and write a short report…</span>')
  const { rid, error } = await post('/finish', { id }).catch(e => ({ error: String(e) }))
  if (error) { say(`<span style="color:#f87171">${esc(error)}</span>`); return false }
  for (let i = 0; i < 30; i++) {
    await new Promise(r => setTimeout(r, 1000))
    const s = await fetch('/reply-status?rid=' + rid).then(r => r.json()).catch(() => ({}))
    if ('ok' in s) {
      if (s.ok) { say('<span style="color:#a3e635">🏁 Finishing up. Its report will show here, then it goes to sleep.</span>'); poll(); return true }
      const reason = /auto mode classifier/i.test(s.reason ?? '') ? 'auto mode in the session running the radar blocks messages sent by the mod.' + blockedHint : (s.reason ?? 'unknown')
      say(`<span style="color:#f87171">Couldn’t ask it to finish: ${esc(reason)}</span>`)
      return false
    }
  }
  say('<span style="color:#fbbf24">Still waiting: is a Claude Code session with the Agent Radar mod open?</span>')
  return false
}

// ===================== notifications =====================
// A finished agent shows a ✓ DONE sign (glowing until you open it; no pop-ups over the network).
// Clicking it opens the drawer with the full message and a reply box.
const notes = new Map()  // session id -> { messageAt, row }   (unread)
const seenAt = new Map() // session id -> messageAt already read
function showNote(r, loud) {
  if (replay.on || !r.messageAt || seenAt.get(r.id) === r.messageAt) return
  const n = notes.get(r.id)
  if (n && n.messageAt === r.messageAt) return
  if (drawerId === r.id) { seenAt.set(r.id, r.messageAt); return } // already looking at it
  notes.set(r.id, { messageAt: r.messageAt, row: r })
  if (loud) alertWaiting(r)
  paintUnread()
}
function markRead(id) {
  const n = notes.get(id)
  if (n) seenAt.set(id, n.messageAt)
  else { const r = agents.get(id)?.row; if (r?.messageAt) seenAt.set(id, r.messageAt) }
  notes.delete(id)
  paintUnread()
}
const newBtn = document.getElementById('nNew')
function paintUnread() {
  for (const [id, el] of rowsEl) el.classList.toggle('unread', notes.has(id))
  newBtn.hidden = notes.size === 0
  newBtn.querySelector('b').textContent = notes.size
  document.title = notes.size ? `(${notes.size}) Agent Radar` : 'Agent Radar'
  syncMiniNotes()
}
newBtn.onclick = () => {
  const newest = [...notes.entries()].sort((a, b) => b[1].messageAt - a[1].messageAt)[0]
  if (newest) { openDrawer(newest[0]); rowsEl.get(newest[0])?.scrollIntoView({ block: 'nearest' }) }
}

const list = document.getElementById('list')

let first = true

function addFeed(row, text, at = Date.now()) {
  const li = document.createElement('li')
  li.style.setProperty('--c', hue(row.project))
  li.innerHTML = `<span class="when">${timeStr(at)} · ${esc(row.project)} · ${esc(clip(row.title, 30))}</span><span class="what mono">${esc(text)}</span>`
  feed.prepend(li)
  while (feed.children.length > 80) feed.lastChild.remove()
}

function rowHtml(r) {
  const st = STATUS[r.status], T = TOOLS[toolOf(r.tool)]
  return `<span class="dot"></span><span class="title">${esc(r.title)}</span><span class="badge"${r.finishing ? ` style="color:${TOOLS.work.c}"` : ''}>${statusLabel(r)}</span>
    <span class="sub"><span class="proj">${esc(r.project)}</span>${r.status === 'working' ? `<span class="tool">${T.label}</span>` : ''}<span class="doing mono">${esc(r.finished ? 'final report ready · ' + r.ago : r.status === 'sleeping' ? 'asleep · ' + r.ago : r.doing)}</span>${r.cost ? `<span class="cost">${money(r.cost)}</span>` : ''}</span>
    ${r.status === 'sleeping' ? '<span class="zz">z z</span>' : ''}`
}

function render(rows, at = Date.now()) {
  const seen = new Set()
  rows.forEach((r, k) => {
    seen.add(r.id)
    let a = agents.get(r.id)
    if (!a) {
      a = { row: r }
      resetAgent(a)
      agents.set(r.id, a)
      if (!first) addFeed(r, 'joined the network', at)
      if (!first && r.status === 'waiting') showNote(r, true)
    } else {
      const was = a.row
      if (was.doing !== r.doing && r.status !== 'sleeping') addFeed(r, (r.status === 'working' ? TOOLS[toolOf(r.tool)].label + ' · ' : '') + r.doing, at)
      if (was.status !== r.status) {
        addFeed(r, r.status === 'sleeping' ? 'fell asleep' : was.status === 'sleeping' ? 'woke up' : r.status === 'waiting' ? '✓ done' : `now ${STATUS[r.status].label.toLowerCase()}`, at)
      }
      // a new finished message: pop a notification card with the whole message and a reply box
      if (r.status === 'waiting' && (was.status !== 'waiting' || was.messageAt !== r.messageAt)) showNote(r, true)
      if (r.status === 'working' && notes.has(r.id)) markRead(r.id) // it carried on by itself
      if (r.finished && !was.finished) { addFeed(r, '🏁 finished · final report ready', at); showNote(r, true) }
      if (r.finishing && !was.finishing) addFeed(r, '🏁 finishing up', at)
      a.row = r
    }
    if (first && r.status === 'working') addFeed(r, r.doing, at)
    if (first && !replay.on && r.finished && Date.now() - (r.reportAt || 0) < 30 * 60e3) showNote(r, false)
    // on opening the page, show agents that finished in the last 30 minutes (quietly)
    if (first && !replay.on && (r.status === 'waiting' || r.status === 'idle') && r.message && Date.now() - (r.messageAt || 0) < 30 * 60e3) showNote(r, false)

    let el = rowsEl.get(r.id)
    if (!el) {
      el = document.createElement('div')
      el.addEventListener('mouseenter', () => { highlighted = r.id })
      el.addEventListener('mouseleave', () => { highlighted = null })
      el.addEventListener('click', () => openDrawer(r.id))
      rowsEl.set(r.id, el)
    }
    const html = rowHtml(r)
    if (el.dataset.html !== html) {
      el.className = `row ${r.status}`
      el.style.setProperty('--s', STATUS[r.status].c)
      el.style.setProperty('--c', hue(r.project))
      el.style.setProperty('--t', TOOLS[toolOf(r.tool)].c)
      el.innerHTML = html
      el.dataset.html = html
      el.classList.toggle('unread', notes.has(r.id))
    }
    if (list.children[k] !== el) list.insertBefore(el, list.children[k] ?? null)
  })
  for (const [id, el] of rowsEl) if (!seen.has(id)) { el.remove(); rowsEl.delete(id) }
  for (const id of [...agents.keys()]) if (!seen.has(id)) agents.delete(id)
  const count = s => rows.filter(r => r.status === s).length
  document.getElementById('nWork').textContent = count('working')
  document.getElementById('nWait').textContent = count('waiting')
  document.getElementById('nSleep').textContent = count('sleeping')
  renderDrawer()
  updateMiniList(rows)
  first = false
}

async function setAlerts(on) {

let audio
function chime() {
  try {
    audio ??= new AudioContext()
    const t0 = audio.currentTime
    ;[[880, 0], [1318.5, 0.14], [1760, 0.28]].forEach(([f, d]) => {
      const o = audio.createOscillator(), g = audio.createGain()
      o.type = 'sine'; o.frequency.value = f
      g.gain.setValueAtTime(0, t0 + d); g.gain.linearRampToValueAtTime(0.18, t0 + d + 0.02); g.gain.exponentialRampToValueAtTime(0.001, t0 + d + 0.9)
      o.connect(g).connect(audio.destination); o.start(t0 + d); o.stop(t0 + d + 1)
    })
  } catch {}
}
function alertWaiting(r) {
  if (!alertsOn) return
  chime()
  try {
    if ('Notification' in window && Notification.permission === 'granted') {
      const body = plain(r.message || r.doing)
      const n = new Notification(`${r.finished ? '🏁 ' + r.title + ' finished · final report' : '✓ ' + r.title + ' is done'} · ${r.project}`, { body: body.length > 300 ? body.slice(0, 299) + '…' : body, tag: r.id + ':' + r.messageAt, silent: true, requireInteraction: true })
      // clicking it brings the radar forward with that agent's card ready to reply
      n.onclick = () => {
        window.focus(); n.close()
        openDrawer(r.id)
        setTimeout(() => drawer.querySelector('#dText')?.focus(), 300)
      }
    }
  } catch {}
}
